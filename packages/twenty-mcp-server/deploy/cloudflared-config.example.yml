# Cloudflare Tunnel config for exposing twenty-mcp-server over public HTTPS.
#
# Prerequisites:
#   brew install cloudflared
#   cloudflared tunnel login
#   cloudflared tunnel create twenty-mcp
#   # then create a DNS route to your tunnel:
#   cloudflared tunnel route dns twenty-mcp twenty-mcp.example.com
#
# Replace <TUNNEL_ID> and the hostname below, then run:
#   cloudflared tunnel --config ./cloudflared-config.yml run

tunnel: <TUNNEL_ID>
credentials-file: /Users/<you>/.cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: twenty-mcp.example.com
    service: http://127.0.0.1:3010
  # Everything else gets a 404.
  - service: http_status:404
